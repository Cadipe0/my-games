# Render 배포 설정 (Blueprint).
#
# 대시보드에서 New > Blueprint 로 이 저장소를 고르면 이 파일대로 만들어진다.
# 손으로 만들 때는 아래 값을 그대로 옮겨 적으면 된다.
#
# 지금은 무료 플랜이라 기록이 남지 않는다. 배포하거나 서버가 재시작되면
# scores.db 가 통째로 사라진다 — 클라우드의 기본 파일 시스템은 임시
# 저장소이기 때문이다. 기록을 지키려면 아래 "기록을 남기려면" 을 참고해
# 유료 플랜으로 올리고 디스크를 붙인다.

services:
  - type: web
    name: game-hub
    runtime: python
    plan: free
    rootDir: server        # 서버 코드가 여기 있다. web/ 은 ../web 으로 알아서 찾는다
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # 환경변수는 지금 필요 없다. API 문서를 열어 보고 싶을 때만 이렇게 넣는다.
    # envVars:
    #   - key: ENABLE_DOCS
    #     value: "1"

# ---------------------------------------------------------------------------
# 기록을 남기려면 — 유료 플랜으로 올린 뒤 이 두 덩이를 되살린다.
#
#     plan: starter
#
#     disks:
#       - name: data
#         mountPath: /var/data
#         sizeGB: 1
#
#     envVars:
#       - key: DATA_DIR        # db.py 가 이 경로에 scores.db 를 만든다
#         value: /var/data
#
# 파이썬 버전은 일부러 고정하지 않았다. 정확한 패치 버전(3.13.15 처럼)을
# 박아 두면 Render 가 그 버전을 안 갖고 있을 때 빌드가 바로 실패한다.
# 이 서버는 3.10 이상이면 도므로 기본값에 맡긴다. 꼭 고정해야 하면
# server/.python-version 을 쓴다.
# ---------------------------------------------------------------------------
