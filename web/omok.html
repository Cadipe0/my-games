<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오목 두기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="shell">
  <header class="topbar">
    <a class="back" href="index.html">← 게임 목록</a>
    <h1 class="page-title">오목</h1>
  </header>

  <main class="panel">
    <div class="game-head">
      <div class="players">
        <div class="player" id="p-human">
          <span class="dot black" id="dot-human"></span>
          <span class="pname" id="name-human">나</span>
        </div>
        <span class="vs">VS</span>
        <div class="player" id="p-ai">
          <span class="dot white" id="dot-ai"></span>
          <span class="pname" id="name-ai">컴퓨터</span>
        </div>
      </div>
      <div class="head-actions">
        <div class="difficulty">
          <span class="diff-label">난이도</span>
          <div class="seg" id="difficulty" role="group" aria-label="난이도 선택"></div>
        </div>
        <button id="reset" class="btn primary small" type="button">다시 하기</button>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="오목판"></div>

      <div id="start-gate" class="start-gate">
        <div class="start-box">
          <h2 class="start-title">난이도를 고르세요</h2>
          <div class="choices" id="start-choices"></div>
          <p class="start-note">검은 돌(선공)은 판마다 추첨으로 정해집니다.</p>
        </div>
      </div>
    </div>

    <p id="status" class="status">당신 차례입니다.</p>
    <p id="record" class="record-line"></p>
    <div id="ranking"></div>
    <div id="record-reset"></div>
  </main>
</div>

<script src="nickname.js"></script>
<script src="scores.js"></script>
<script src="ranking-ui.js"></script>
<script src="reset-ui.js"></script>
<script src="highscore.js"></script>
<script src="omok-ai.js"></script>
<script src="omok.js"></script>
</body>
</html>
