<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>텍스트 게임</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-time="dusk">

<div class="shell">
  <header class="topbar">
    <a class="back" href="index.html">← 게임 목록</a>
    <h1 class="page-title">텍스트 게임</h1>
    <button type="button" class="btn ghost small" id="codex-open">엔딩 도감</button>
  </header>

  <main class="panel">
    <div class="story-text" id="story"></div>

    <div class="hud" id="hud" hidden>
      <span class="tag" id="hp-text">❤ 100 / 100</span>
      <span class="hpbar" id="hpbar"><i style="width:100%"></i></span>
      <span id="stats" title="용기: 공격력과 급소 확률 / 신중함: 회피율과 도주 비용">용기 0 · 신중함 0</span>
    </div>

    <div class="inv-bar" id="inv" hidden></div>

    <div class="enemy" id="enemy" hidden>
      <span class="enemy-name" id="enemy-name"></span>
      <span class="enemy-bar"><i id="enemy-fill" style="width:100%"></i></span>
      <span class="enemy-hp" id="enemy-hp"></span>
    </div>

    <div class="log" id="log" hidden></div>

    <div class="choices" id="choices"></div>
  </main>
</div>

<div class="modal" id="codex" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>엔딩 도감</h2>
      <button type="button" class="btn ghost small" id="codex-close">닫기</button>
    </div>
    <p class="hint" id="codex-rate"></p>
    <div class="codex-grid" id="codex-grid"></div>
    <div id="ranking"></div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="small" id="codex-reset">기록 초기화</button>
    </div>
  </div>
</div>

<script src="nickname.js"></script>
<script src="scores.js"></script>
<script src="ranking-ui.js"></script>
<script src="reset-ui.js"></script>
<script src="story.js"></script>
<script src="adventure.js"></script>
</body>
</html>
